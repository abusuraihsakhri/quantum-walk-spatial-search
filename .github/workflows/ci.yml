name: Quantum Walk Spatial Search CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Compile Python source
        run: python -m compileall -q agents quantum_walk cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Smoke-test installed CLI
        run: quantum-walk-search --nodes 16 --samples 5 --csv /tmp/quantum-walk.csv

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check web/app.mjs
      - name: Run standalone browser-engine tests
        run: node --test tests/test_web.mjs
      - name: Verify static-site files
        run: |
          test -s web/index.html
          test -s web/app.mjs
          test -s web/style.css
          grep -q './app.mjs' web/index.html
          grep -q './style.css' web/index.html

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and auditor
        run: python -m pip install -e ".[server,test]" pip-audit
      - name: Audit installed dependencies
        run: pip-audit --strict
