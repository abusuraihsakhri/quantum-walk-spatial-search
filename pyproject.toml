[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-walk-spatial-search"
version = "2.0.0"
description = "Continuous-time quantum-walk search simulator and legacy threshold-audit utilities"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
quantum-walk-spatial-search = "quantum_walk.cli:main"
quantum-walk-search = "quantum_walk.search:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-walk-spatial-search"
Repository = "https://github.com/abusuraihsakhri/quantum-walk-spatial-search.git"
