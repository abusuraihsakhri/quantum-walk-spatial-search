[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-walk-spatial-search"
version = "2.0.0"
description = "Continuous-Time & Discrete Quantum Walk Graph Search Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quantum-walk-spatial-search = "quantum_walk.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-walk-spatial-search"
Repository = "https://github.com/abusuraihsakhri/quantum-walk-spatial-search.git"
